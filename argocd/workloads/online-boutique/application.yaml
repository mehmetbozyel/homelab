apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: online-boutique
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:mehmetbozyel/homelab.git
    targetRevision: main
    path: kubernetes/workloads/online-boutique/manifests
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true