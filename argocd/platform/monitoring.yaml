apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/observability/kube-prometheus-stack/values.yaml

    - repoURL: git@github.com:mehmetbozyel/homelab.git
      targetRevision: main
      ref: values

    - repoURL: git@github.com:mehmetbozyel/homelab.git
      targetRevision: main
      path: kubernetes/platform/observability/kube-prometheus-stack/dashboards

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true