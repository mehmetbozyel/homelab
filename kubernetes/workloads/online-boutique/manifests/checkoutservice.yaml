apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
    spec:
      containers:
        - name: checkoutservice
          image: ghcr.io/mehmetbozyel/online-boutique-checkoutservice:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 5050
          env:
            - name: PORT
              value: "5050"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"

            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice:50051"

            - name: EMAIL_SERVICE_ADDR
              value: "emailservice:5000"

            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"

            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"

          readinessProbe:
            grpc:
              port: 5050

          livenessProbe:
            grpc:
              port: 5050

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  namespace: online-boutique
spec:
  selector:
    app: checkoutservice
  ports:
    - name: grpc
      port: 5050
      targetPort: 5050