apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: online-boutique
  labels:
    app: productcatalogservice

spec:
  replicas: 1

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: ghcr.io/mehmetbozyel/online-boutique-productcatalogservice:latest

          ports:
            - containerPort: 3550
              name: grpc

          env:
            - name: PORT
              value: "3550"

            - name: DISABLE_TRACING
              value: "1"

            - name: DISABLE_PROFILER
              value: "1"

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi