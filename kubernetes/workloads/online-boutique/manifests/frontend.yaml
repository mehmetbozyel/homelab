apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/mehmetbozyel/online-boutique-frontend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"

            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"

            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"

            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"

            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"

            - name: AD_SERVICE_ADDR
              value: "adservice:9555"

            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "shoppingassistantservice:80"

            - name: ENABLE_PROFILER
              value: "0"

            - name: ENV_PLATFORM
              value: "local"

          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: /_healthz
              port: 8080
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-readiness-probe

          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: /_healthz
              port: 8080
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-liveness-probe

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: online-boutique
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-boutique
  namespace: online-boutique

spec:
  ingressClassName: traefik

  rules:
    - host: shop.bozyel.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80